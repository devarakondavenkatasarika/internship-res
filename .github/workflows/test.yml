name: Test Internship API

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add sample data
        run: npm run seed

      - name: Start API
        run: |
          node server.js > server.log 2>&1 &
          sleep 5

      - name: Test API
        run: |
          echo "Testing Home API..."
          curl -f http://localhost:3000

          echo "Testing GET all internships..."
          curl -f http://localhost:3000/api/internships

          echo "Testing Pagination..."
          curl -f "http://localhost:3000/api/internships?page=1&limit=5"

          echo "Testing POST - Create internship..."
          curl -f -X POST http://localhost:3000/api/internships \
            -H "Content-Type: application/json" \
            -d '{"id":"TEST-999","title":"Test Intern","domain":"Full Stack Development","mode":"Remote","location":"India","skills":["Node.js","Express","SQL"],"openings":1}'

          echo "Testing GET by ID..."
          curl -f http://localhost:3000/api/internships/TEST-999

          echo "Testing PUT - Update internship..."
          curl -f -X PUT http://localhost:3000/api/internships/TEST-999 \
            -H "Content-Type: application/json" \
            -d '{"title":"Updated Test Intern","domain":"Full Stack Development","mode":"Hybrid","location":"India","skills":["Node.js","Express","SQL"],"openings":2}'

          echo "Testing DELETE..."
          curl -f -X DELETE http://localhost:3000/api/internships/TEST-999

          echo "All API tests completed successfully!"
